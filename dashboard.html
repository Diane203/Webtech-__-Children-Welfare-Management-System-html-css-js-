<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Hope Haven</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0B1120] text-slate-300 font-sans antialiased">

    <!-- SIDEBAR -->
    <aside id="sidebar" class="w-64 bg-[#0B1120] border-r border-slate-800 flex flex-col h-screen fixed left-0 top-0 z-20"></aside>

    <!-- MAIN -->
    <main class="ml-64 min-h-screen flex flex-col">
        <header id="topnav" class="flex justify-between items-center px-8 py-4 border-b border-slate-800 bg-[#0B1120] sticky top-0 z-10"></header>
        <div id="dashboard-content" class="p-8 flex-1 overflow-y-auto fade-in"></div>
    </main>

    <!-- MODAL -->
    <div id="modal-overlay" class="modal-overlay hidden">
        <div id="modal-content" class="bg-slate-900 border border-slate-800 rounded-xl p-8 w-full max-w-md shadow-2xl"></div>
    </div>

    <script src="data.js?v=9"></script>
<script src="app.js?v=9"></script>
    <script>
        // Initialize dashboard
        if (!currentUser) {
            window.location.href = 'login.html';
        } else {
            renderDashboard('dashboard');
        }
    </script>
</body>
</html>
