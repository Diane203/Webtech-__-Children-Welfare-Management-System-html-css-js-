<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Hope Haven</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0B1120] text-slate-300 font-sans antialiased min-h-screen flex flex-col">

    <nav class="flex justify-between items-center p-6 border-b border-slate-800 sticky top-0 bg-[#0B1120]/95 backdrop-blur z-50">
        <div class="text-2xl font-bold text-white flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
            <span class="bg-emerald-500 text-white p-1.5 rounded-lg text-sm">🏠</span> Hope<span class="text-emerald-500">Haven</span>
        </div>
        <div class="hidden md:flex items-center gap-8">
            <a href="index.html" class="text-slate-300 hover:text-white transition">Home</a>
            <a href="about.html" class="text-slate-300 hover:text-white transition">About</a>
            <a href="impact.html" class="text-slate-300 hover:text-white transition">Impact</a>
            <a href="sponsor.html" class="text-slate-300 hover:text-white transition">Sponsor</a>
            <a href="contact.html" class="text-slate-300 hover:text-white transition">Contact</a>
        </div>
    </nav>

    <main class="flex-1 flex items-center justify-center px-4 py-12">
        <div class="w-full max-w-md fade-in">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl">
                <div class="text-center mb-8">
                    <div class="w-16 h-16 bg-emerald-500/20 text-emerald-400 rounded-2xl flex items-center justify-center text-3xl mx-auto mb-4">📝</div>
                    <h1 class="text-2xl font-bold text-white mb-1">Create Account</h1>
                    <p class="text-sm text-slate-500">Join Hope Haven today</p>
                </div>

                <form id="registerForm" onsubmit="handleRegister(event)">
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2 text-slate-300">Full Name *</label>
                        <input type="text" id="regName" required placeholder="Your Full Name" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2 text-slate-300">Email Address *</label>
                        <input type="email" id="regEmail" required placeholder="you@hopehaven.rw" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2 text-slate-300">Phone Number</label>
                        <input type="tel" id="regPhone" placeholder="+250 7XX XXX XXX" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2 text-slate-300">Role *</label>
                        <select id="regRole" required class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500 transition">
                            <option value="">Select your role...</option>
                            <option value="staff">Staff Member</option>
                            <option value="admin">Administrator</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2 text-slate-300">Password *</label>
                        <input type="password" id="regPassword" required minlength="6" placeholder="At least 6 characters" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <div class="mb-6">
                        <label class="block text-sm font-medium mb-2 text-slate-300">Confirm Password *</label>
                        <input type="password" id="regConfirmPassword" required minlength="6" placeholder="Re-enter password" class="w-full bg-slate-800 border border-slate-700 rounded-lg p-3 text-white focus:outline-none focus:border-emerald-500 transition">
                    </div>
                    <button type="submit" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white font-bold py-3 rounded-lg transition">Create Account</button>
                </form>

                <p class="text-center text-sm text-slate-500 mt-6">
                    Already have an account? <a href="login.html" class="text-emerald-400 hover:underline font-medium">Login here</a>
                </p>
                <p class="text-center text-sm text-slate-500 mt-2">
                    <a href="index.html" class="text-slate-400 hover:text-emerald-400 transition">← Back to homepage</a>
                </p>
            </div>

            <p class="text-center text-xs text-slate-600 mt-6">© 2026 Hope Haven — Children Welfare Management System</p>
        </div>
    </main>
<script src="data.js?v=9"></script>
<script src="app.js?v=9"></script>
    
</body>
</html>
